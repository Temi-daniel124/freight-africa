# Applies migrations to the Freight Africa database. After launch this is the ONLY way (D029).
name: Migrate

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type the project ref to confirm: czlowhaycaivpgimcefk"
        required: true

permissions:
  contents: read

concurrency:
  group: migrate
  cancel-in-progress: false

jobs:
  migrate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      PROJECT_REF: czlowhaycaivpgimcefk
      CONFIRM: ${{ inputs.confirm }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - name: Guard the target project (D026)
        run: |
          if [ "$CONFIRM" != "$PROJECT_REF" ]; then
            echo "::error::Confirmation '$CONFIRM' does not match $PROJECT_REF"
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1
        with:
          version: 3.0.0 # keep in step with the supabase dev dependency
      - run: supabase link --project-ref "$PROJECT_REF"
      - run: test "$(cat supabase/.temp/project-ref)" = "$PROJECT_REF"
      - name: Show what will run
        run: supabase db push --remote --dry-run
      - name: Apply
        run: supabase db push --remote --yes
      - run: supabase migration list --remote
      - name: Check for drift
        run: |
          supabase db diff --remote --schema public > drift.sql
          if [ -s drift.sql ]; then cat drift.sql; exit 1; fi
